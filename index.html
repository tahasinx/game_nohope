<!DOCTYPE html>
<html lang="en">
<head>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>ABANDON ALL HOPE</title>
<meta name="theme-color" content="#05060a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="All Hope" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg" />
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="./assets/css/styles.css" />

</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="topbar">
    <div>
      <div class="stat"><span class="label">WAVE</span> <span id="waveNum">1</span></div>
      <div id="health"></div>
      <div id="powerups"></div>
    </div>
    <div class="stat" style="text-align:right">
      <span class="label">KILLS</span> <span id="kills">0</span><br>
      <span class="label" id="zleft"></span>
    </div>
  </div>

  <div id="ammoWrap">
    <div id="mag"></div>
    <div id="reloadBar"><div id="reloadFill"></div></div>
    <div id="reloadHint">[R] RELOAD</div>
  </div>

  <div id="banner"><span id="bannerText"></span><span id="bannerSub"></span></div>
  <div id="toast"></div>
</div>

<div id="flash"></div>

<div id="picker" class="hidden">
  <div id="pickerTitle"></div>
  <div id="pickerSub"></div>
  <div id="cards"></div>
</div>

<!-- title screen: a live, slow-drifting shot of the cabin behind a left-hand menu column -->
<div id="menu" class="splash">
  <div id="menuShade"></div>
  <div id="menuCol">
    <div id="title"><div id="titleTop" class="distressed">ABANDON</div><div id="titleMain" class="distressed">ALL HOPE</div></div>
    <div id="pressAny">PRESS ANY KEY</div>
    <nav id="menuList">
      <div id="menuMarker"></div>
      <button data-act="play"><i>01</i><span>PLAY</span></button>
      <button data-act="how"><i>02</i><span>HOW TO PLAY</span></button>
      <button data-act="settings"><i>03</i><span>SETTINGS</span></button>
      <button data-act="install"><i>04</i><span>INSTALL APP</span></button>
      <button data-act="wavedash"><i>05</i><span>PLAY ON WAVEDASH</span></button>
    </nav>
  </div>

  <section id="howPanel" class="mpanel">
    <h2>HOW TO PLAY</h2>
    <div class="mrows">
      <div class="crow"><span class="caps"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><b>MOVE</b></div>
      <div class="crow"><span class="caps"><kbd class="wide">MOUSE</kbd></span><b>AIM</b></div>
      <div class="crow"><span class="caps"><kbd class="wide">CLICK</kbd></span><b>SHOOT</b><em>hold to keep firing</em></div>
      <div class="crow touch-row"><span class="caps"><kbd class="wide">TOUCH</kbd></span><b>LEFT MOVE/TURN · RIGHT AIM/FIRE</b></div>
      <div class="crow"><span class="caps"><kbd>R</kbd></span><b>RELOAD</b></div>
      <div class="crow"><span class="caps"><kbd class="wide">ESC</kbd></span><b>PAUSE</b></div>
      <div class="crow"><span class="caps"><kbd>M</kbd></span><b>MUTE</b></div>
    </div>
  </section>

  <section id="settingsPanel" class="mpanel">
    <h2>SETTINGS</h2>
    <div class="mrows" id="settingRows">
      <div class="srow" data-key="master"><b>MASTER VOLUME</b><span class="meter"></span><em></em></div>
      <div class="srow" data-key="music"><b>MUSIC VOLUME</b><span class="meter"></span><em></em></div>
      <div class="srow" data-key="shake"><b>SCREEN SHAKE</b><span class="toggle"></span><em></em></div>
    </div>
  </section>

  <section id="installPanel" class="mpanel" aria-labelledby="installTitle">
    <h2 id="installTitle">INSTALL APP</h2>
    <p id="installMessage"></p>
  </section>

  <div id="menuFoot">
    <div id="bestRun"></div>
    <div id="menuHints"></div>
  </div>
</div>
<div id="fadeIn"></div>
<div id="touchControls" class="hidden" aria-label="Touch controls">
  <div id="touchStick" aria-hidden="true"><div id="touchKnob"></div></div>
  <button id="touchFire" class="touch-button" type="button" aria-label="Aim and fire">FIRE</button>
  <button id="touchReload" class="touch-button" type="button">RELOAD</button>
  <button id="touchPause" class="touch-button" type="button" aria-label="Pause">Ⅱ</button>
</div>

<div id="pause" class="overlay hidden">
  <div id="pauseTitle" class="distressed">PAUSED</div>
  <div id="pauseStat"></div>
  <div id="pauseMenu" class="vmenu">
    <button id="resumeBtn">RESUME</button>
    <button id="quitBtn">QUIT TO TITLE</button>
  </div>
  <div class="sub" style="margin-top:28px"><span class="key">ESC</span> resume</div>
</div>

<div id="death" class="overlay hidden">
  <div id="deathTitle" class="distressed">YOU DIED</div>
  <div id="deathStat"></div>
  <div id="deathBest"></div>
  <div id="deathMenu" class="vmenu">
    <button id="retryBtn">TRY AGAIN</button>
    <button id="deathQuitBtn">MAIN MENU</button>
  </div>
</div>

<script type="module" src="./assets/js/game.js"></script>
</body>
</html>
